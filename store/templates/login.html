{% load static %}
<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · Re:Room</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans','Nunito',sans-serif;color:#111;background:#fff}.auth-shell{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.auth-art{min-height:100vh;border-radius:0 48px 48px 0;overflow:hidden;position:relative;background:#f3e1cc}.auth-art img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}.auth-content{display:flex;align-items:center;justify-content:center;padding:38px 45px}.auth-card{width:min(100%,560px)}.auth-title{text-align:center;font-size:29px;line-height:1.2;font-weight:800;color:#ff359a;margin:0 0 54px;letter-spacing:.3px}.user-icon{width:68px;height:68px;margin:0 auto 52px;background:#ffb0c8;border-radius:50%;position:relative;display:block}.user-icon:before{content:'';width:25px;height:25px;border-radius:50%;background:#ff4384;position:absolute;left:22px;top:15px}.user-icon:after{content:'';position:absolute;width:42px;height:20px;background:#ff4384;border-radius:24px 24px 14px 14px;left:13px;bottom:0}.messages{display:grid;gap:8px;margin-bottom:16px}.message{font-size:14px;border-radius:10px;padding:10px 13px;background:#fff1ed;color:#c25452}.message.success{background:#eff8ed;color:#4f8654}.field{margin:0 0 25px}.input-wrap{position:relative}.field input{width:100%;height:72px;border:1.3px solid #171717;border-radius:17px;padding:0 30px;background:white;outline:none;font-size:20px;color:#292323;transition:.2s}.field input::placeholder{color:#777;font-style:italic;font-weight:400}.field input:focus{border-color:#f94b9c;box-shadow:0 0 0 3px #f94b9c1c}.toggle-pass svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.toggle-pass{position:absolute;right:20px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#555;font-size:19px}.submit{width:74%;min-height:68px;display:block;margin:38px auto 19px;border:0;border-radius:17px;background:#ffe0ca;color:#f044bf;font-size:27px;font-weight:800;transition:.2s}.submit:hover{background:#ffd3c0;transform:translateY(-2px);box-shadow:0 7px 18px #ee987230}.google{width:74%;height:65px;margin:0 auto;display:flex;justify-content:center;align-items:center;gap:13px;border:0;border-radius:16px;background:#9d8df5;color:#fff;font-size:21px;font-weight:800;transition:.2s}.google:hover{background:#8d7ce9;transform:translateY(-2px)}.google-mark{display:grid;place-items:center;width:39px;height:39px;background:#fff;border-radius:11px;color:#4285f4;font-size:25px;font-weight:900}.switch{margin:24px 0 0;text-align:center;font-size:20px;font-style:italic;font-weight:400;color:#dc54e8}.switch a{color:#d840ed;text-decoration:underline;text-underline-offset:3px}.back-home{display:block;width:max-content;margin:20px auto 0;color:#a38583;font-size:13px}.back-home:hover{color:#de4d8b}.demo-note{text-align:center;margin:12px 0 0;color:#ac9b9b;font-size:11px}
@media(max-width:850px){.auth-shell{grid-template-columns:.85fr 1.15fr}.auth-content{padding:28px}.auth-title{font-size:24px;margin-bottom:40px}.user-icon{margin-bottom:40px}.field input{height:64px}.submit,.google{width:88%}}@media(max-width:620px){.auth-shell{display:block;padding:12px;min-height:100vh}.auth-art{display:none}.auth-content{min-height:calc(100vh - 24px);padding:30px 10px}.auth-card{max-width:470px}.auth-title{font-size:23px;margin:10px 0 28px}.user-icon{margin-bottom:30px;width:58px;height:58px}.user-icon:before{left:18px;top:12px}.user-icon:after{left:8px}.field{margin-bottom:15px}.field input{height:59px;border-radius:13px;padding-left:20px;font-size:17px}.submit{min-height:58px;font-size:23px;margin-top:28px}.google{height:56px;font-size:17px}.google-mark{width:32px;height:32px;font-size:21px}.switch{font-size:17px}}
</style><link rel="stylesheet" href="{% static 'store/fonts.css' %}"></head><body><main class="auth-shell"><div class="auth-art"><img src="{% static 'store/images/login-room.jpg' %}" alt="Phòng khách nhỏ sắc màu ấm áp"></div><section class="auth-content"><div class="auth-card"><h1 class="auth-title">CHÀO MỪNG ĐẾN VỚI RE:ROOM</h1><span class="user-icon" aria-hidden="true"></span>
{% if messages %}<div class="messages">{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
<form method="post">{% csrf_token %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<div class="field"><div class="input-wrap"><input name="username" type="text" placeholder="Tên đăng nhập" autocomplete="username" aria-label="Tên đăng nhập" required value="{{ request.POST.username|default:'' }}"></div></div><div class="field"><div class="input-wrap"><input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" aria-label="Mật khẩu" required><button class="toggle-pass" type="button" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div><button class="submit" type="submit">Đăng nhập</button></form><button class="google" id="googleDemo" type="button"><span class="google-mark">G</span>Đăng nhập với Google</button><p class="switch">Hoặc là <a href="{% url 'dang_ky' %}">tạo tài khoản nè</a></p><a class="back-home" href="{% url 'trang_chu' %}">← Quay về Re:Room</a></div></section></main><script>document.querySelector('.toggle-pass').addEventListener('click',event=>{const input=document.getElementById('password');input.type=input.type==='password'?'text':'password';event.currentTarget.setAttribute('aria-label',input.type==='password'?'Hiện mật khẩu':'Ẩn mật khẩu')});document.getElementById('googleDemo').addEventListener('click',()=>alert('Đăng nhập Google sẽ được kết nối sau. Bạn có thể tạo tài khoản để trải nghiệm bản demo nhé!'));</script></body></html>
