  <title id="title">Phòng khách RE:ROOM</title>
  <desc id="desc">Phòng khách vui nhộn với tường tím, sofa xanh, gối hồng, cây xương rồng và đèn bàn.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#777ddd"/><stop offset="1" stop-color="#8079d8"/></linearGradient>
    <linearGradient id="sofa" x2="0" y2="1"><stop stop-color="#607bf1"/><stop offset="1" stop-color="#4568e6"/></linearGradient>
    <linearGradient id="coral" x2="0" y2="1"><stop stop-color="#ff967e"/><stop offset="1" stop-color="#f2786d"/></linearGradient>
    <linearGradient id="rug" x2="0" y2="1"><stop stop-color="#f88b7a"/><stop offset="1" stop-color="#f7a08d"/></linearGradient>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8bc7e9"/><stop offset="1" stop-color="#f3899d"/></linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
