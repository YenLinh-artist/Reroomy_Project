{% load static %}
<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo tài khoản · Re:Room</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans','Nunito',sans-serif;color:#111;background:#fff}.auth-shell{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;gap:0;padding:0 0 0 0}.auth-art{min-height:100vh;border-radius:0 48px 48px 0;overflow:hidden;position:relative;background:#f3e1cc}.auth-art img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}.auth-art:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#34201808,#34201815)}.auth-content{display:flex;align-items:center;justify-content:center;padding:38px 42px}.auth-card{width:min(100%,560px)}.brand{font-weight:900;letter-spacing:-1.4px;color:#ff327e;font-size:29px;white-space:nowrap}.brand span{color:#bd245c}.auth-title{text-align:center;font-size:29px;line-height:1.2;font-weight:800;color:#ff6b51;margin:0 0 22px;letter-spacing:.3px}.auth-title b{color:#ff347f;margin-left:5px}.user-icon{width:68px;height:68px;margin:0 auto 25px;background:#ffb0c8;border-radius:50%;position:relative;display:block}.user-icon:before{content:'';width:25px;height:25px;border-radius:50%;background:#ff4384;position:absolute;left:22px;top:15px}.user-icon:after{content:'';position:absolute;width:42px;height:20px;background:#ff4384;border-radius:24px 24px 14px 14px;left:13px;bottom:0}.messages{display:grid;gap:8px;margin-bottom:15px}.message{font-size:14px;border-radius:10px;padding:10px 13px;background:#fff1ed;color:#c25452}.message.success{background:#eff8ed;color:#4f8654}.field{margin:0 0 19px}.field label{display:block;font-size:21px;font-weight:700;margin:0 0 10px 14px}.input-wrap{position:relative}.field input{width:100%;height:72px;border:1.3px solid #171717;border-radius:17px;padding:0 30px;background:white;outline:none;font-size:20px;color:#292323;transition:.2s}.field input::placeholder{color:#aaa;font-style:italic;font-weight:400}.field input:focus{border-color:#f94b9c;box-shadow:0 0 0 3px #f94b9c1c}.toggle-pass svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.toggle-pass{position:absolute;right:20px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#555;font-size:19px}.input-wrap input[type=password],.input-wrap input[type=text]{padding-right:56px}.submit{width:74%;min-height:68px;display:block;margin:25px auto 0;border:0;border-radius:17px;background:#ffe0ca;color:#f044bf;font-size:27px;font-weight:800;transition:.2s}.submit:hover{background:#ffd3c0;transform:translateY(-2px);box-shadow:0 7px 18px #ee987230}.switch{margin:30px 0 0;text-align:center;font-size:20px;font-style:italic;font-weight:400;color:#dc54e8}.switch a{color:#d840ed;text-decoration:underline;text-underline-offset:3px}.back-home{display:block;width:max-content;margin:23px auto 0;color:#a38583;font-size:13px}.back-home:hover{color:#de4d8b}
@media(max-width:850px){.auth-shell{grid-template-columns:.85fr 1.15fr}.auth-content{padding:28px}.auth-title{font-size:24px}.field input{height:64px}.field label{font-size:18px}}@media(max-width:620px){.auth-shell{display:block;padding:12px;min-height:100vh}.auth-art{display:none}.auth-content{min-height:calc(100vh - 24px);padding:30px 10px}.auth-card{max-width:470px}.auth-title{font-size:23px;margin:20px 0}.field{margin-bottom:15px}.field input{height:59px;border-radius:13px;padding-left:20px;font-size:17px}.field label{font-size:16px;margin-left:8px}.submit{min-height:58px;font-size:23px}.switch{font-size:17px}}
</style><link rel="stylesheet" href="{% static 'store/fonts.css' %}"></head><body><main class="auth-shell"><div class="auth-art"><img src="{% static 'store/images/signup-room.jpg' %}" alt="Ph&#242;ng ng&#7911; nh&#7887; trang tr&#237; t&#244;ng pastel"></div><section class="auth-content"><div class="auth-card"><h1 class="auth-title">TẠO TÀI KHOẢN <b>RE:ROOM</b></h1><span class="user-icon" aria-hidden="true"></span>
{% if messages %}<div class="messages">{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
<form method="post" novalidate>{% csrf_token %}<div class="field"><label for="username">TÊN ĐẦY ĐỦ</label><div class="input-wrap"><input id="username" name="username" type="text" placeholder="Tên đăng nhập" autocomplete="username" required value="{{ request.POST.username|default:'' }}"></div></div><div class="field"><label for="email">EMAIL</label><div class="input-wrap"><input id="email" name="email" type="email" placeholder="Nhập email" autocomplete="email" required value="{{ request.POST.email|default:'' }}"></div></div><div class="field"><label for="password">MẬT KHẨU</label><div class="input-wrap"><input id="password" name="password" type="password" placeholder="Tạo mật khẩu" autocomplete="new-password" minlength="8" required><button class="toggle-pass" type="button" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div><div class="field"><div class="input-wrap"><input id="password-confirm" name="password_confirm" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" minlength="8" aria-label="Nhập lại mật khẩu" required><button class="toggle-pass" type="button" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div><button class="submit" type="submit">Đăng ký</button></form><p class="switch">Có tài khoản? <a href="{% url 'dang_nhap' %}">Đăng nhập nhé</a></p><a class="back-home" href="{% url 'trang_chu' %}">← Quay về Re:Room</a></div></section></main><script>document.querySelectorAll('.toggle-pass').forEach(button=>button.addEventListener('click',()=>{const input=button.parentElement.querySelector('input');input.type=input.type==='password'?'text':'password';button.setAttribute('aria-label',input.type==='password'?'Hiện mật khẩu':'Ẩn mật khẩu')}));</script></body></html>
