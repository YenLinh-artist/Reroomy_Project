{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Tạo tài khoản | RE:ROOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pathway+Extreme:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'store/css/register.css' %}">
    <link rel="stylesheet" href="{% static 'store/css/typography.css' %}">
</head>
<body>
    <main class="register-page">
        <section class="register-visual" aria-label="Góc cửa hàng RE:ROOM">
            <img src="{% static 'store/images/register/register-illustration-1.png' %}" alt="Minh họa cửa hàng nhỏ ấm cúng">
        </section>

        <section class="register-panel" aria-labelledby="register-title">
            <div class="register-content">
                <h1 class="register-title" id="register-title">
                    <span>TẠO TÀI KHOẢN</span>
                    <a class="wordmark" href="{% url 'trang_chu' %}" aria-label="RE:ROOM trang chủ">RE:ROOM</a>
                </h1>

                <div class="avatar" aria-hidden="true">
                    <svg viewBox="0 0 68 68" role="presentation">
                        <circle cx="34" cy="34" r="34" fill="currentColor" opacity=".48" />
                        <circle cx="34" cy="28" r="12" fill="currentColor" />
                        <path d="M13 62c1.6-12 9.4-19 21-19s19.4 7 21 19" fill="currentColor" />
                    </svg>
                </div>

                <form class="register-form" id="register-form">
                    <div class="field-group">
                        <label for="register-username">TÊN ĐẦY ĐỦ</label>
                        <input id="register-username" name="username" type="text" placeholder="Tên đăng nhập" autocomplete="username" required>
                    </div>

                    <div class="field-group">
                        <label for="register-email">EMAIL CỦA BẠN</label>
                        <input id="register-email" name="email" type="email" placeholder="Nhập email " autocomplete="email" required>
                    </div>

                    <div class="field-group password-group">
                        <label for="register-password">MẬT KHẨU</label>
                        <div class="password-input-wrap">
                            <input id="register-password" name="password" type="password" placeholder="Tạo mới mật khẩu" autocomplete="new-password" required>
                            <button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" data-target="register-password">
                                <svg class="eye-icon" viewBox="0 0 32 32" aria-hidden="true">
                                    <path d="M3.5 16s4.2-8 12.5-8 12.5 8 12.5 8-4.2 8-12.5 8S3.5 16 3.5 16Z" />
                                    <circle cx="16" cy="16" r="3.5" />
                                    <path class="eye-slash" d="M5 27 27 5" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="field-group confirm-group">
                        <label class="visually-hidden" for="register-confirm-password">Nhập lại mật khẩu</label>
                        <div class="password-input-wrap">
                            <input id="register-confirm-password" name="confirm_password" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
                            <button class="password-toggle" type="button" aria-label="Hiện mật khẩu nhập lại" aria-pressed="false" data-target="register-confirm-password">
                                <svg class="eye-icon" viewBox="0 0 32 32" aria-hidden="true">
                                    <path d="M3.5 16s4.2-8 12.5-8 12.5 8 12.5 8-4.2 8-12.5 8S3.5 16 3.5 16Z" />
                                    <circle cx="16" cy="16" r="3.5" />
                                    <path class="eye-slash" d="M5 27 27 5" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button class="submit-button" type="submit">Đăng ký</button>
                    <p class="form-message" id="form-message" role="status" aria-live="polite" hidden></p>
                </form>

                <p class="login-prompt">Có tài khoản? <a href="{% url 'dang_nhap' %}">Đăng nhập nhé</a></p>
            </div>
        </section>
    </main>
    <script>
        document.querySelectorAll('.password-toggle').forEach((button) => {
            button.addEventListener('click', () => {
                const password = document.getElementById(button.dataset.target);
                const showPassword = password.type === 'password';
                password.type = showPassword ? 'text' : 'password';
                button.setAttribute('aria-pressed', String(showPassword));
                button.setAttribute('aria-label', showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
                button.classList.toggle('is-visible', showPassword);
            });
        });

        document.getElementById('register-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const password = document.getElementById('register-password');
            const confirmation = document.getElementById('register-confirm-password');
            if (password.value !== confirmation.value) {
                confirmation.setCustomValidity('Mật khẩu nhập lại chưa khớp.');
                confirmation.reportValidity();
                confirmation.addEventListener('input', () => confirmation.setCustomValidity(''), { once: true });
                return;
            }

            const message = document.getElementById('form-message');
            message.textContent = 'Biểu mẫu đã hợp lệ. Tính năng tạo tài khoản chưa được kết nối.';
            message.hidden = false;
        });
    </script>
</body>
</html>
