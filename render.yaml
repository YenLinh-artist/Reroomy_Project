services:
  - type: web
    name: reroom-team-staging
    runtime: python
    plan: free
    branch: reroom-team-staging
    buildCommand: bash build.sh
    startCommand: gunicorn reroomy_core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DJANGO_SETTINGS_MODULE
        value: reroomy_core.settings_staging
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ADMIN_DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
  - type: cron
    name: reroom-monthly-voucher-summary
    runtime: python
    plan: free
    branch: reroom-team-staging
    schedule: "59 16 * * *" # Render uses UTC; this is 23:59 in Vietnam.
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python manage.py issue_monthly_vouchers --settings=reroomy_core.settings_staging
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DJANGO_SETTINGS_MODULE
        value: reroomy_core.settings_staging
      - key: DJANGO_SECRET_KEY
        fromService:
          name: reroom-team-staging
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: ADMIN_DEMO_MODE
        fromService:
          name: reroom-team-staging
          type: web
          envVarKey: ADMIN_DEMO_MODE
      - key: DATABASE_URL
        fromService:
          name: reroom-team-staging
          type: web
          envVarKey: DATABASE_URL
      - key: CLOUDINARY_URL
        fromService:
          name: reroom-team-staging
          type: web
          envVarKey: CLOUDINARY_URL
