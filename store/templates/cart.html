{% load static %}
<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Giỏ hàng | RE:ROOM</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#141414;font-family:Arial,sans-serif}.top{height:82px;display:flex;align-items:center;padding:0 max(calc((100% - 1280px)/2),5.5%);gap:25px}.brand{margin-right:auto;color:#ff3474;font-size:26px;font-weight:800;text-decoration:none}.icons{display:flex;align-items:center;gap:35px}.icons img{width:35px;height:35px}.count{margin-left:-36px;margin-top:-26px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:#ffa5a5;color:#d43d3d;font-size:12px}.page{max-width:1280px;min-height:calc(100vh - 350px);margin:auto;padding:20px 24px 100px}.title{display:flex;align-items:center;gap:22px;margin:0 0 26px;font-size:46px;font-weight:800}.title a{color:#343943;text-decoration:none;font-size:55px;font-weight:400}.content{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(290px,1fr);gap:22px}.cart-list{display:grid;align-content:start;gap:14px}.item{position:relative;min-height:159px;display:grid;grid-template-columns:150px minmax(0,1fr) 84px;gap:22px;align-items:center;padding:8px 10px;border:1px solid #ff858e;border-radius:10px}.item img{width:143px;height:140px;object-fit:cover;border-radius:3px}.details h2{margin:0 0 8px;color:#e75c35;font-family:Georgia,serif;font-style:italic;font-size:25px}.details p{margin:6px 0;color:#777;font-size:14px;font-style:italic}.price{color:#df1000!important;font-style:normal!important;font-weight:800}.delivery{font-style:italic}.quantity{display:flex;align-items:center;justify-content:flex-end;gap:7px}.quantity button{width:28px;height:28px;border:0;border-radius:5px;background:#ffafb4;color:#f24e5f;font-size:19px;line-height:1;cursor:pointer;transition:background .15s,transform .15s}.quantity button:hover{background:#ff8f9a;transform:scale(1.06)}.quantity button:focus-visible{outline:2px solid #d7425a;outline-offset:2px}.quantity span{min-width:14px;text-align:center}.remove-item{position:absolute;top:8px;right:10px;padding:2px 4px;border:0;background:transparent;color:#c94454;font-size:13px;text-decoration:underline;cursor:pointer}.remove-item:hover{color:#9c2634}.voucher{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#e8b58b;color:#fff;font-size:20px;font-weight:800}.voucher button{border:0;background:none;font-size:22px}.summary{margin-top:18px;padding:18px;border-radius:10px;background:#fff0ea;color:#8c5448}.row{display:flex;justify-content:space-between;margin:12px 0;font-size:17px}.total{font-size:22px;font-weight:800;color:#e85e3e}.checkout{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:8px;background:#d16f4c;color:#fff;font-size:20px;font-weight:700;text-align:center}.empty{display:none;padding:35px;border:1px dashed #e7b3b3;color:#8c7777;text-align:center}.empty:not([hidden]){display:block}.footer{min-height:275px;padding:44px max(calc((100% - 1240px)/2),5.5%);border-radius:34px 34px 0 0;background:#ffddc7;display:flex;justify-content:space-between}.footer strong{font-size:30px}.footer p{max-width:440px;font-size:17px;line-height:1.4}.footer img{width:34px;margin-right:15px}.footer-links{display:flex;gap:100px;font-size:24px;font-weight:600}.toast{position:fixed;right:24px;bottom:24px;padding:13px 18px;border-radius:9px;background:#fff1f3;color:#b73f5b;box-shadow:0 3px 14px #0002;display:none}.toast.show{display:block}
@media(max-width:760px){.top{height:64px;padding:0 16px}.icons{gap:15px}.icons img{width:27px;height:27px}.count{margin-left:-18px}.page{padding:15px 14px 50px}.title{font-size:31px;gap:12px}.title a{font-size:42px}.content{grid-template-columns:1fr}.item{grid-template-columns:90px minmax(0,1fr) 68px;gap:10px;min-height:112px;padding:7px}.item img{width:86px;height:96px}.details h2{font-size:18px}.details p{font-size:12px;margin:4px 0}.quantity{gap:4px}.quantity button{width:20px;height:20px}.voucher{font-size:17px}.footer{padding:28px 20px;min-height:205px}.footer strong{font-size:23px}.footer p{font-size:13px}.footer-links{gap:16px;font-size:16px}.footer>div:last-child{display:none}}
</style>    <link rel="stylesheet" href="{% static 'store/css/typography.css' %}">
</head><body><header class="top"><a class="brand" href="{% url 'trang_chu' %}">RE:ROOM</a><div class="icons"><a href="{% url 'goi_y_san_pham' %}" aria-label="Tìm kiếm"><img src="{% static 'store/images/icons/search.svg' %}" alt=""></a><a href="{% url 'gio_hang' %}" aria-label="Giỏ hàng"><img src="{% static 'store/images/icons/bag.svg' %}" alt=""></a><span class="count" id="cartCount">0</span><a href="{% url 'ho_so' %}" aria-label="Tài khoản">◎</a></div></header><main class="page"><h1 class="title"><a href="{% url 'trang_chu' %}" aria-label="Quay lại">‹</a>GIỎ HÀNG CỦA BẠN</h1><div class="content"><section class="cart-list" id="cartList"></section>
<aside id="cartSummary" hidden><div class="voucher">Voucher <button id="voucherButton" aria-label="Chọn voucher">♢</button></div><div class="summary"><p class="row"><span>Tạm tính</span><strong id="subtotal">0 đ</strong></p><p class="row"><span>Phí vận chuyển</span><strong id="shipping">0 đ</strong></p><p class="row"><span>Giảm giá</span><strong id="discount">0 đ</strong></p><hr><p class="row total"><span>Tổng cộng</span><strong id="total">0 đ</strong></p><a class="checkout" href="{% url 'thanh_toan' %}">Tiến hành thanh toán</a></div></aside></div><div class="empty" id="empty" hidden>Giỏ hàng của bạn đang trống. <a href="{% url 'trang_chu' %}">Tiếp tục mua sắm</a></div></main>
<footer class="footer"><div><strong>RE:ROOM</strong><p>Chúng tớ có ở các nền tảng mạng xã hội, nơi bạn có thể tìm và tham khảo.</p><img src="{% static 'store/images/icons/instagram.svg' %}" alt="Instagram"><img src="{% static 'store/images/icons/facebook.svg' %}" alt="Facebook"><img src="{% static 'store/images/icons/threads.svg' %}" alt="Threads"><img src="{% static 'store/images/icons/tiktok.svg' %}" alt="TikTok"></div><div class="footer-links"><span>Shop</span><span>About</span></div></footer><div class="toast" id="toast"></div>
<script>
    const CART_STORAGE_KEY = 'reroomy-cart-items';
    const FALLBACK_IMAGE = "{% static 'store/images/home/04.jpeg' %}";
    const cartList = document.getElementById('cartList');
    const cartCount = document.getElementById('cartCount');
    const emptyMessage = document.getElementById('empty');
    const cartSummary = document.getElementById('cartSummary');
    let voucher = localStorage.getItem('reroomy-cart-voucher') === 'true';
    let cartItems = [];

    function loadCartItems() {
        try {
            const savedItems = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '[]');
            if (!Array.isArray(savedItems)) return [];
            return savedItems.filter(item => item && item.id != null && item.name).map(item => ({
                ...item,
                unitPrice: Math.max(0, Number(item.unitPrice) || 0),
                quantity: Math.max(1, Math.min(99, Number(item.quantity) || 1)),
            }));
        } catch {
            return [];
        }
    }

    function saveCartItems() {
        try {
            localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cartItems));
        } catch {
            show('Không thể lưu giỏ hàng trên trình duyệt này');
        }
    }

    function money(value) {
        return `${value.toLocaleString('vi-VN')} đ`;
    }

    function makeButton(className, label, text) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = className;
        button.setAttribute('aria-label', label);
        button.textContent = text;
        return button;
    }

    function renderCart() {
        cartList.replaceChildren();
        cartItems.forEach(item => {
            const row = document.createElement('article');
            row.className = 'item';
            row.dataset.itemId = String(item.id);
            row.dataset.price = item.unitPrice;

            const image = document.createElement('img');
            image.src = item.image || FALLBACK_IMAGE;
            image.alt = item.name;
            const details = document.createElement('div');
            details.className = 'details';
            const name = document.createElement('h2');
            name.textContent = item.name;
            const variant = document.createElement('p');
            variant.textContent = `Phân loại: ${item.variant || 'Mặc định'}`;
            const price = document.createElement('p');
            price.className = 'price';
            price.textContent = money(item.unitPrice);
            const delivery = document.createElement('p');
            delivery.className = 'delivery';
            delivery.textContent = 'Giao hàng trong 3–5 ngày';
            details.append(name, variant, price, delivery);

            const quantity = document.createElement('div');
            quantity.className = 'quantity';
            quantity.append(
                makeButton('plus', 'Tăng số lượng', '+'),
                Object.assign(document.createElement('span'), { textContent: item.quantity }),
                makeButton('minus', 'Giảm số lượng', '−'),
            );
            const remove = makeButton('remove-item', `Xóa ${item.name} khỏi giỏ`, 'Xóa');
            row.append(image, details, quantity, remove);
            cartList.appendChild(row);
        });
        recalculateCart();
    }

    function recalculateCart() {
        const subtotal = cartItems.reduce((sum, item) => sum + item.unitPrice * item.quantity, 0);
        const count = cartItems.reduce((sum, item) => sum + item.quantity, 0);
        const shipping = count ? 20000 : 0;
        const discount = voucher ? Math.round(subtotal * 0.1) : 0;
        document.getElementById('subtotal').textContent = money(subtotal);
        document.getElementById('shipping').textContent = money(shipping);
        document.getElementById('discount').textContent = money(discount);
        document.getElementById('total').textContent = money(subtotal - discount + shipping);
        cartCount.textContent = count;
        emptyMessage.hidden = count > 0;
        cartSummary.hidden = count === 0;
    }

    cartItems = loadCartItems();
    saveCartItems();
    renderCart();

    cartList.addEventListener('click', event => {
        const button = event.target.closest('.plus, .minus, .remove-item');
        if (!button) return;
        const row = button.closest('.item');
        const item = cartItems.find(entry => String(entry.id) === row.dataset.itemId);
        if (!item) return;

        if (button.classList.contains('remove-item')) {
            cartItems = cartItems.filter(entry => entry !== item);
        } else if (button.classList.contains('plus')) {
            item.quantity = Math.min(99, item.quantity + 1);
        } else if (item.quantity > 1) {
            item.quantity -= 1;
        }

        saveCartItems();
        renderCart();
    });

    document.getElementById('voucherButton').addEventListener('click', event => {
        voucher = !voucher;
        localStorage.setItem('reroomy-cart-voucher', String(voucher));
        event.currentTarget.textContent = voucher ? '✓' : '♢';
        show(voucher ? 'Đã áp dụng voucher giảm 10%' : 'Đã bỏ voucher');
        recalculateCart();
    });

    function show(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        window.setTimeout(() => toast.classList.remove('show'), 1500);
    }
</script></body></html>
