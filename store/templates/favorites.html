{% load static %}
<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đã thích | RE:ROOM</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#151515;font-family:Arial,sans-serif}.page{max-width:1440px;min-height:100vh;margin:auto;padding:28px 48px}.back{display:flex;align-items:center;gap:18px;margin:4px 0 28px;color:#d73d3d;font-size:36px}.back a{color:#383b42;text-decoration:none;font-size:52px;line-height:1}.toolbar{display:flex;align-items:center;gap:46px;margin-bottom:36px}.filter{position:relative}.filter>button{min-width:153px;height:57px;border:0;border-radius:8px;background:#ddd;color:#111;font-size:22px}.filter-menu{position:absolute;z-index:3;top:64px;left:0;min-width:180px;padding:8px;border:1px solid #ddd;border-radius:8px;background:#fff;box-shadow:0 5px 15px #0002;display:none}.filter-menu.open{display:grid}.filter-menu button{padding:10px;border:0;background:white;text-align:left}.filter-menu button:hover{background:#fff0f1}.edit{margin-left:auto;border:0;background:transparent;color:#111;font-size:24px;font-weight:700;text-decoration:underline}.edit span{color:#ff1786}.items{display:grid;gap:20px}.item{position:relative;display:grid;grid-template-columns:218px minmax(0,1fr);width:min(100%,900px);min-height:225px;border:1px solid #fa8d8d}.product-photo{display:grid;place-items:center;margin:5px;background:#d9d9d9}.product-photo img{width:100%;height:210px;object-fit:cover}.info{padding:15px 18px}.name{margin:0 42px 22px 0;font-size:30px;font-weight:500}.price{margin:0 0 14px;color:#ff4e55;font-size:25px;font-weight:700}.stars{margin:0 0 12px;color:#ffce00;font-size:30px;letter-spacing:4px}.sales{margin:0;font-size:19px}.heart{position:absolute;top:18px;right:18px;border:0;background:transparent;color:#ff4248;font-size:32px}.remove{display:none;position:absolute;right:18px;bottom:14px;border:0;border-radius:6px;background:#fff0f1;color:#c63e4e;padding:8px 12px}.editing .remove{display:block}.empty{display:none;padding:44px 20px;text-align:center;color:#8b817d;border:1px dashed #e9c7c7;border-radius:10px;font-size:18px}.empty.show{display:block}.toast{position:fixed;right:24px;bottom:24px;padding:13px 18px;border-radius:9px;background:#fff0f3;color:#bd3c5c;box-shadow:0 3px 16px #0002;display:none}.toast.show{display:block}
@media(max-width:650px){.page{padding:18px 14px}.back{font-size:27px;margin-bottom:20px}.back a{font-size:42px}.toolbar{gap:8px;flex-wrap:wrap;margin-bottom:22px}.filter>button{min-width:0;height:42px;padding:0 12px;font-size:15px}.edit{font-size:17px}.item{grid-template-columns:115px minmax(0,1fr);min-height:138px}.product-photo img{height:126px}.info{padding:10px}.name{font-size:18px;margin-bottom:12px}.price{font-size:17px;margin-bottom:6px}.stars{font-size:20px;letter-spacing:1px;margin-bottom:4px}.sales{font-size:14px}.heart{top:8px;right:8px;font-size:23px}.remove{right:8px;bottom:7px;font-size:12px;padding:5px 8px}}
</style>    <link rel="stylesheet" href="{% static 'store/css/typography.css' %}">
</head><body><main class="page"><header class="back"><a href="{% url 'trang_chu' %}" aria-label="Quay lại">‹</a><span>Đã thích</span></header><div class="toolbar"><div class="filter"><button id="allFilter">Tất cả</button></div><div class="filter"><button id="statusToggle">Trạng thái⌄</button><div class="filter-menu" id="statusMenu"><button data-status="all">Tất cả sản phẩm</button><button data-status="available">Còn hàng</button><button data-status="sale">Đang giảm giá</button></div></div><div class="filter"><button id="saleFilter">Giảm giá</button></div><button class="edit" id="editToggle">Chỉnh sửa <span>✎</span></button></div>
<section class="items" id="items"><article class="item" data-status="available" data-sale="true"><a class="product-photo" href="{% url 'san_pham_mau' %}"><img src="{% static 'store/images/home/04.jpeg' %}" alt="Ghế lười thư giãn"></a><div class="info"><h1 class="name">Ghế lười thư giãn</h1><p class="price">0 - 200K</p><div class="stars">★★★★◐</div><p class="sales">2.0K lượt bán</p></div><button class="heart" aria-label="Bỏ yêu thích">♥</button><button class="remove">Bỏ khỏi yêu thích</button></article><article class="item" data-status="available" data-sale="false"><a class="product-photo" href="{% url 'san_pham_mau' %}"><img src="{% static 'store/images/home/08.png' %}" alt="Gối trang trí"></a><div class="info"><h2 class="name">Gối trang trí dễ thương</h2><p class="price">120K</p><div class="stars">★★★★★</div><p class="sales">980 lượt bán</p></div><button class="heart" aria-label="Bỏ yêu thích">♥</button><button class="remove">Bỏ khỏi yêu thích</button></article><article class="item" data-status="available" data-sale="true"><a class="product-photo" href="{% url 'san_pham_mau' %}"><img src="{% static 'store/images/home/05.png' %}" alt="Đèn ngủ"></a><div class="info"><h2 class="name">Đèn ngủ hình cà phê</h2><p class="price">100K</p><div class="stars">★★★★◐</div><p class="sales">1.4K lượt bán</p></div><button class="heart" aria-label="Bỏ yêu thích">♥</button><button class="remove">Bỏ khỏi yêu thích</button></article></section><div class="empty" id="empty">Không tìm thấy sản phẩm phù hợp.</div></main><div class="toast" id="toast">Đã bỏ sản phẩm khỏi danh sách yêu thích</div>
<script>let status='all',onlySale=false;const cards=[...document.querySelectorAll('.item')];function filter(){let count=0;cards.forEach(c=>{const show=(status==='all'||c.dataset.status===status)&&(!onlySale||c.dataset.sale==='true');c.hidden=!show;if(show)count++});document.getElementById('empty').classList.toggle('show',count===0)}document.getElementById('statusToggle').addEventListener('click',()=>document.getElementById('statusMenu').classList.toggle('open'));document.getElementById('statusMenu').addEventListener('click',e=>{const b=e.target.closest('[data-status]');if(!b)return;status=b.dataset.status;document.getElementById('statusMenu').classList.remove('open');filter()});document.getElementById('saleFilter').addEventListener('click',e=>{onlySale=!onlySale;e.currentTarget.style.background=onlySale?'#ffb5bd':'#ddd';filter()});document.getElementById('allFilter').addEventListener('click',()=>{status='all';onlySale=false;document.getElementById('saleFilter').style.background='#ddd';filter()});document.getElementById('editToggle').addEventListener('click',()=>document.getElementById('items').classList.toggle('editing'));document.querySelectorAll('.heart,.remove').forEach(b=>b.addEventListener('click',()=>{const card=b.closest('.item');card.remove();filter();const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}));</script></body></html>
