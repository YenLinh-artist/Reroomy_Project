t{flex:none;background:#fff;cursor:pointer}.product img{display:block;width:100%;height:205px;object-fit:cover}.product strong{display:block;padding:9px 10px 13px;font-size:15px}.product:hover{outline:2px solid #ff90bd}.close-catalog{position:absolute;z-index:2;top:-10px;right:-8px;width:28px;height:28px;border:1px solid #222;border-radius:50%;background:white;font-size:18px}.stage{position:relative;min-height:0;background:#d9d5d1;overflow:hidden}.room-image{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s,transform .2s}.stage.mode-2d .room-image{filter:saturate(.8);transform:scale(1.015)}.stage.mode-3d .room-image{filter:saturate(1.04)}.stage.hidden-catalog{grid-column:1/-1}.hotspot{position:absolute;display:grid;place-items:center;width:42px;height:42px;border:2px solid #fff;border-radius:50%;background:#e2fbff;color:#3684a0;box-shadow:0 1px 5px #777;cursor:grab;font-size:18px}.hotspot img{width:28px;height:28px;object-fit:contain}.mini-preview{position:absolute;left:9%;bottom:39%;width:154px;height:150px;border:1px solid white;border-radius:5px;background:#fff9;padding:9px}.mini-preview img{width:100%;height:100%;object-fit:contain}.toast{position:fixed;right:22px;bottom:20px;padding:12px 18px;border-radius:8px;background:#fff;color:#ca4c6c;box-shadow:0 4px 18px #0002;display:none}.toast.show{display:block}.catalog.closed{display:none}.workspace.catalog-closed{grid-template-columns:1fr}

</head><body><div class="app"><header class="toolbar"><button class="exit" onclick="location.href='{% url 'goi_y_combo' %}'"><span>⇦</span>thoát</button><div class="history"><button id="undo" aria-label="Hoàn tác">↶</button><button id="redo" aria-label="Làm lại">↷</button></div><div class="mode"><button data-mode="2d">2D</button><button class="active" data-mode="3d">3D</button></div><div class="save-tools"><button id="save" title="Lưu thiết kế">▣</button><button id="download" title="Tải xuống">⇩</button></div></header>
<main class="workspace" id="workspace"><aside class="catalog" id="catalog"><button class="close-catalog" id="closeCatalog" aria-label="Ẩn danh mục">×</button><nav class="categories"><button class="active" data-category="sofa"><span>🛋</span>P.Khách</button><button data-category="bed"><span>▱</span>P.Ngủ</button><button data-category="desk"><span>▤</span>P.Học</button><button data-category="bath"><span>♨</span>P.Tắm</button><button data-category="toilet"><span>♧</span>Toilet</button><button data-category="chair"><span>♙</span>Bàn ghế</button><button data-category="storage"><span>▣</span>Tủ đồ</button><button data-category="light"><span>♜</span>Đèn</button></nav><section class="products"><input class="search" id="search" placeholder="Tìm kiếm"><div class="product" data-category="sofa" data-name="Sofa phòng khách"><img src="{% static 'store/images/home/product-sofa.png' %}" alt="Sofa phòng khách"><strong>Sofa phòng khách</strong></div><div class="product" data-category="sofa" data-name="Sofa không tay ghế"><img src="{% static 'store/images/home/14.jpeg' %}" alt="Sofa không tay ghế"><strong>Sofa không tay ghế</strong></div><div class="product" data-category="chair" data-name="Ghế lười"><img src="{% static 'store/images/home/04.jpeg' %}" alt="Ghế lười"><strong>Ghế lười</strong></div><div class="product" data-category="bed" data-name="Gối trang trí"><img src="{% static 'store/images/home/08.png' %}" alt="Gối trang trí"><strong>Gối trang trí</strong></div><div class="product" data-category="light" data-name="Đèn ngủ"><img src="{% static 'store/images/home/05.png' %}" alt="Đèn ngủ"><strong>Đèn ngủ</strong></div><div class="product" data-category="desk" data-name="Bàn học"><img src="{% static 'store/images/home/11.png' %}" alt="Bàn học"><strong>Bàn học</strong></div></section></aside><section class="stage mode-3d" id="stage"><img class="room-image" id="roomImage" src="{% static 'store/images/home/14.jpeg' %}" alt="Phòng khách mô phỏng"><div class="hotspots" id="hotspots"><button class="hotspot" style="left:29%;top:65%" title="Sản phẩm trong phòng">＋</button><button class="hotspot" style="left:49%;top:72%" title="Sản phẩm trong phòng">＋</button></div><div class="mini-preview"><img src="{% static 'store/images/home/product-sofa.png' %}" alt="Xem trước phòng"></div></section></main></div><div class="toast" id="toast"></div>
<script>const catalog=document.getElementById('catalog'),workspace=document.getElementById('workspace'),stage=document.getElementById('stage'),hotspots=document.getElementById('hotspots'),undoStack=[],redoStack=[];function notify(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}function snapshot(){undoStack.push(hotspots.innerHTML);redoStack.length=0}document.querySelectorAll('.categories button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.categories button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.product').forEach(p=>p.hidden=p.dataset.category!==b.dataset.category)}));document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLocaleLowerCase('vi');document.querySelectorAll('.product').forEach(p=>p.hidden=!p.dataset.name.toLocaleLowerCase('vi').includes(q))});document.querySelectorAll('.product').forEach(p=>p.addEventListener('click',()=>{snapshot();const x=24+Math.random()*55,y=20+Math.random()*60;const b=document.createElement('button');b.className='hotspot';b.style.left=x+'%';b.style.top=y+'%';b.title=p.dataset.name;b.innerHTML='＋';hotspots.append(b);notify('Đã thêm '+p.dataset.name+' vào phòng')}));document.querySelectorAll('.mode button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('active',x===b));stage.classList.toggle('mode-2d',b.dataset.mode==='2d');stage.classList.toggle('mode-3d',b.dataset.mode==='3d')}));document.getElementById('closeCatalog').addEventListener('click',()=>{catalog.classList.add('closed');workspace.classList.add('catalog-closed')});document.getElementById('undo').addEventListener('click',()=>{if(!undoStack.length)return;redoStack.push(hotspots.innerHTML);hotspots.innerHTML=undoStack.pop()});document.getElementById('redo').addEventListener('click',()=>{if(!redoStack.length)return;undoStack.push(hotspots.innerHTML);hotspots.innerHTML=redoStack.pop()});document.getElementById('save').addEventListener('click',()=>{localStorage.setItem('reroom-combo',hotspots.innerHTML);notify('Đã lưu thiết kế combo')});document.getElementById('download').addEventListener('click',()=>{const a=document.createElement('a');a.href=document.getElementById('roomImage').src;a.download='reroom-combo.jpg';a.click()});</script></body></html>
